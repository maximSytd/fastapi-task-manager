services:

  postgres:
    image: postgres:15.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /data/postgres
    volumes:
       - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
    env_file:
      - .env
    restart: unless-stopped

  redis:
    image: redis:7.4.0
    ports:
      - "6379:6379"
    volumes:
      - ./data:/data
    networks:
      - postgres

networks:
  postgres:

volumes:
    postgres:
