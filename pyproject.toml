[project]
name = "fastapi-task-manager"
version = "1.0.0"
description = "Test task project project"
authors = [{ name = "Your name" }]
requires-python = ">=3.11, <4.0"
license = "MIT"
dependencies = [
    "fastapi[standard]>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "django-split-settings>=1.1.0,<2",
    "tortoise-orm[asyncpg]>=0.24,<0.25",
    "aerich>=0.8,<0.9",
    "httpx>=0.28,<0.29",
    "pydantic-settings~=2.8",
    "sentry-sdk~=2.25",
    "pydantic-i18n>=0.4.5,<0.5",
    "fastapi-babel>=1,<2",
    "fastapi-pagination>=0.12,<0.13",
    "passlib (>=1.7.4,<2.0.0)",
    "bcrypt (>=4.3.0,<5.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "cryptography (>=45.0.5,<46.0.0)",
    "async-factory-boy>=1.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.5.4,<0.6",
    "pytest~=8.2",
    "requests>=2.28.1,<3",
    "pytest-asyncio>=0.24.0,<0.25",
    "asgi-lifespan>=2.1.0,<3",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.aerich]
tortoise_orm = "config.tortoise_settings"
location = "app/db/migrations"
src_folder = "./app"

[tool.pytest.ini_options]
pythonpath = [
  "app",
  ".",
]
addopts = [
    "--import-mode=importlib",
]
asyncio_default_fixture_loop_scope = "module"
